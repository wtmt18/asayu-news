name: Publish from claude/publish

# Cloud scheduled runs may only be allowed to push to claude/-prefixed branches.
# When they push to claude/publish, fast-forward main to it and send the notification.
on:
  push:
    branches: ['claude/publish']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/publish
          fetch-depth: 0
      - name: Move main to claude/publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save web-push@3
      - run: sleep 60
      - name: Pick up new registrations
        run: node scripts/collect-subs.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      - name: Commit registrations
        run: |
          if ! git diff --quiet push/subscriptions.json || [ -n "$(git status --porcelain data/inbox.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add push/subscriptions.json data/inbox.json 2>/dev/null; git add push/subscriptions.json; [ -f data/inbox.json ] && git add data/inbox.json; git commit -m "通知・地域の登録を追加"
            for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
          fi
      - run: node scripts/send-push.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
